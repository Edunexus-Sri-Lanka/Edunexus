  "mark-release"(el){ withBusy("markRelease", async ()=>{
    const M = S.tests.marking, subId = el.dataset.id;
    const { total, outOf } = await saveMarks(subId);
    const s = M.subs.find(x=>x.id===subId);
    const up = await sb.from("test_submissions").update({ status:"released", released_at:new Date().toISOString(),
      total_score: total, total_marks: outOf }).eq("id", subId);
    if(up.error) throw up.error;
    const pct = outOf ? Math.round(total/outOf*100) : 0;
    const att = await sb.from("attempts").insert({ student_id: s.student_id, kind:"test", subject:M.test.subject,
      topic:M.test.topic, score:pct, meta:{ test:M.test.title, submission:subId, marks:`${total}/${outOf}` } });
    if(att.error) toast("Released, but the genome update failed: "+att.error.message);
    s.status = "released"; s.total_score = total; s.total_marks = outOf;

  async "badge-toggle"(el){

    const clean = cur.filter(x=>earned.has(x));            // drop anything no longer earned

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");

});
/* Tap/click ripple on buttons and tabs, everywhere in the app. Skipped
   entirely when "Reduced motion" is on, since animationend never fires
   for a killed animation and the ripple span would just sit there. */
document.addEventListener("pointerdown", e=>{
  if(document.documentElement.dataset.motion==="reduced") return;
  const el = e.target.closest(".btn,.tabs button,.seg button");
  if(!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 1.15;
  const span = document.createElement("span");
  span.className = "ripple";
  span.style.width = span.style.height = size + "px";
  span.style.left = (e.clientX - r.left - size/2) + "px";
  span.style.top = (e.clientY - r.top - size/2) + "px";
  el.appendChild(span);
  span.addEventListener("animationend", () => span.remove());
});
function openSheet(){
  const here = (location.hash.split("/")[1]||"");
  const items = [...(S.moreRoutes||[]), {h:"#/settings", t:"Settings", i:"settings"}];
  $("#sheet").innerHTML = `<div class="sheet-grab"></div>
    <div class="sheet-who">${avatarHtml(S.me, 40)}<div><b>${esc(S.me.full_name)}</b>
      <div class="note" style="text-transform:capitalize">${esc(S.me.role)}</div></div></div>
    ${items.map(r=>`<a class="${r.h.split("/")[1]===here?"on":""}" href="${r.h}" data-act="close-sheet">${I[r.i]}${r.t}</a>`).join("")}
    <button class="sheet-out" data-act="sheet-signout">Sign out</button>`;
  $("#sheet").hidden = false; $("#sheetBack").hidden = false;
  requestAnimationFrame(()=>{ $("#sheet").classList.add("open"); $("#sheetBack").classList.add("open"); });
}
function closeSheet(){
  const sh = $("#sheet"); if(!sh || sh.hidden) return;
  sh.classList.remove("open"); $("#sheetBack").classList.remove("open");
  setTimeout(()=>{ sh.hidden = true; $("#sheetBack").hidden = true; }, 180);
}

  $("#sheet").hidden = false; $("#sheetBack").hidden = false;
  requestAnimationFrame(()=>{ $("#sheet").classList.add("open"); $("#sheetBack").classList.add("open"); });

/* ================= boot ================= */
async function loadStudent(){
  const [{data:courses},{data:enrol},{data:attempts},{data:port},{data:threads},{data:memory}] = await Promise.all([
    sb.from("courses").select("*").eq("published",true).order("created_at",{ascending:false}),
    sb.from("enrollments").select("course_id").eq("student_id",S.me.id),
    sb.from("attempts").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false}).limit(300),
    sb.from("portfolio_items").select("*").eq("student_id",S.me.id).order("created_at",{ascending:false}),
    sb.from("chat_threads").select("*").eq("student_id",S.me.id).order("updated_at",{ascending:false}),
    sb.from("student_memory").select("id, note, source, created_at").eq("student_id",S.me.id).order("created_at",{ascending:true})
  ]);
  S.courses = courses||[]; S.enrolled = (enrol||[]).map(e=>e.course_id);
  S.attempts = attempts||[]; S.portfolio = port||[];
  S.chatThreads = threads||[];
  S.studentMemory = memory||[];
  S.activeThreadId = S.chatThreads[0]?.id || null;
  S.chat = S.activeThreadId ? await loadThreadMessages(S.activeThreadId) : [];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const { data:lessons } = await sb.from("lessons").select("*").in("course_id",ids).eq("published",true);
    S.lessons = lessons||[];
  }
}
async function loadThreadMessages(threadId){
  const { data } = await sb.from("chat_messages").select("role, content")
    .eq("thread_id", threadId).order("created_at",{ascending:true}).limit(200);
  return (data||[]).map(m=>({role:m.role, content:m.content}));
}
async function loadTeacher(){
  const [{data:courses},{data:students}] = await Promise.all([
    sb.from("courses").select("*").eq("teacher_id",S.me.id).order("created_at",{ascending:false}),
    sb.from("profiles").select("id, full_name, grade, created_at, avatar_url, banner, badges_shown, border, name_style, unlock_all").eq("role","student").order("full_name")
  ]);
  S.courses = courses||[]; S.students = students||[];
  const ids = S.courses.map(c=>c.id);
  if(ids.length){
    const [{data:lessons},{data:enrol}] = await Promise.all([
      sb.from("lessons").select("*").in("course_id",ids),
      sb.from("enrollments").select("*").in("course_id",ids)
    ]);
    S.lessons = lessons||[]; S.enrollRows = enrol||[];
  }
  const { data:att } = await sb.from("attempts").select("*").order("created_at",{ascending:false}).limit(1000);
  S.classAttempts = att||[];
  const [lg, pf, en] = await Promise.all([
    sb.from("login_days").select("user_id, day"),
    sb.from("portfolio_items").select("student_id"),
    sb.from("enrollments").select("student_id")
  ]);
  S.classLogins = lg.data||[]; S.classPortfolio = pf.data||[]; S.allEnrol = en.data||[];
}
async function boot(){
  if(!sb){
    $("#gate").innerHTML = `<div style="max-width:380px;text-align:center;padding:20px">
      <b style="color:var(--ink)">Not connected</b>
      <p style="margin-top:8px">${esc(configProblem)}</p></div>`;
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ location.replace("login.html"); return; }
  const { data:profile, error } = await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error || !profile){
    $("#gate").innerHTML = `<div style="text-align:center;padding:20px">Your profile row is missing. Run schema.sql, then sign in again.
      <br><br><button class="btn" onclick="signOut()">Sign out</button></div>`;
    return;
  }
  S.me = profile;
  S.authEmail = session.user.email;
  /* Appearance follows the account. Local wins on first paint, then the
     account's saved preferences fill in anything this device hasn't set. */
  try{
    const saved = (profile.settings||{}).prefs;
    if(saved){
      const local = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
      const merged = local ? { ...saved, ...local } : saved;
      localStorage.setItem(PREFS_KEY, JSON.stringify(merged));
      applyPrefs({ ...PREF_DEFAULTS, ...merged });
    }
  }catch(e){}

  // Is the v2 schema actually there?
  const probe = await sb.from("courses").select("id").limit(1);
  if(probe.error){
    const missing = /does not exist|schema cache|relation/i.test(probe.error.message);
    $("#gate").innerHTML = `<div style="max-width:460px;padding:24px;text-align:center">
      <b style="color:var(--ink);font-size:16px">${missing?"The database is out of date":"Cannot read the database"}</b>
      <p style="margin-top:10px;line-height:1.6">${missing
        ? "This version needs the newer schema.sql, with the courses, lessons and attempts tables. Open Supabase → SQL Editor, paste the whole of schema.sql, and run it. Then reload this page."
        : esc(probe.error.message)}</p>
      <p style="margin-top:10px;font-size:11px">If you have just run it and still see this, go to Settings → API and click Reload schema cache.</p>
      <button class="btn" style="margin-top:14px" onclick="location.reload()">Reload</button>
      <button class="btn ghost" style="margin-top:8px" onclick="signOut()">Sign out</button></div>`;
    return;
  }

  try{
    const d = new Date(), today = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    await sb.from("login_days").upsert({ user_id:S.me.id, day:today }, { onConflict:"user_id,day", ignoreDuplicates:true });
    const { data:days } = await sb.from("login_days").select("day").eq("user_id",S.me.id).order("day",{ascending:false}).limit(400);
    S.loginDays = (days||[]).map(r=>r.day);
  }catch(e){ S.loginDays = []; }
  S.badgesBefore = null;
  try{ S.me.role==="student" ? await loadStudent() : await loadTeacher(); }
  catch(e){ toast("Could not load your data: "+e.message); }
  $("#whoami").innerHTML = `${esc(S.me.full_name)}<br><span style="color:var(--teal)">${esc(S.me.role)}</span>`;
  $("#signout").onclick = signOut;
  const gate = $("#gate");
  gate.classList.add("hide"); setTimeout(()=>gate.remove(), 700);   // fade the loading screen out over the app
  $("#shell").style.visibility = "visible";
  if(!location.hash) location.hash = S.me.role==="student" ? "#/home" : "#/class";
  route();
  setTimeout(checkUnlocks, 900);   // after the loading screen has faded
}
async function signOut(){
  await sb.auth.signOut();
  // belt-and-braces: clear any stray Supabase auth keys in either store, so a
  // switched "keep me signed in" choice can't leave a stale session behind.
  [localStorage, sessionStorage].forEach(store => {
    Object.keys(store).filter(k => k.startsWith("sb-")).forEach(k => store.removeItem(k));
  });
  location.replace("login.html");
}
boot();
