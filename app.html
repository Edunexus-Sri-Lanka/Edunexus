<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduNexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&family=Caveat:wght@700&family=Playfair+Display:ital,wght@0,700;1,800&family=JetBrains+Mono:wght@700&family=Orbitron:wght@800&family=Press+Start+2P&family=Bungee&family=Cinzel:wght@800&display=swap" rel="stylesheet">
<script>
/* Runs before the page draws, so there is no flash of the wrong theme. */
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("edunexus-prefs") || "{}"), r = document.documentElement;
    var t = p.theme || "dark";
    if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    r.dataset.theme = t; r.dataset.accent = p.accent || "teal";
    r.dataset.size = p.size || "normal"; r.dataset.motion = p.motion || "full";
  }catch(e){}
})();
</script>
<style>
:root{
  /* Midnight — the original look */
  --bg:#040a09; --bg2:#070f0e; --panel:#0a1614; --panel2:#0d1d1a;
  --line:#153630; --line-soft:#102520; --bar:rgba(7,15,14,.96);
  --accent-rgb:47,227,192; --teal:#2fe3c0; --teal-dim:#1c8c78; --teal-ghost:rgba(var(--accent-rgb),.10);
  --on-accent:#032019;
  --ink:#e6f6f2; --ink-2:#a9c8c1; --mute:#6f918a;
  --warn:#f08a5d; --warn-soft:rgba(240,138,93,.12); --warn-line:rgba(240,138,93,.45);
  --r:14px; --r-sm:10px;
  --fs-1:11px; --fs-2:12.5px; --fs-3:14px; --fs-4:16px; --fs-5:20px; --fs-6:26px; --fs-7:34px;
  color-scheme:dark;
}
/* Light */
:root[data-theme="light"]{
  --bg:#f4f8f7; --bg2:#eaf2f0; --panel:#ffffff; --panel2:#f1f7f5;
  --line:#cfe1dc; --line-soft:#e1ece9; --bar:rgba(255,255,255,.96);
  --accent-rgb:14,150,125; --teal:#0e967d; --teal-dim:#7fcdbd;
  --on-accent:#ffffff;
  --ink:#0c201c; --ink-2:#36524c; --mute:#688680;
  --warn:#cc5a26; --warn-soft:rgba(204,90,38,.09); --warn-line:rgba(204,90,38,.4);
  color-scheme:light;
}
/* Accents. The orange warning colour never changes: it only ever means "weak". */
:root[data-accent="sky"]    {--accent-rgb:92,190,255;  --teal:#5cbeff; --teal-dim:#2a6f9c; --on-accent:#021726;}
:root[data-accent="violet"] {--accent-rgb:176,140,255; --teal:#b08cff; --teal-dim:#6848b0; --on-accent:#160a33;}
:root[data-accent="lime"]   {--accent-rgb:176,230,90;  --teal:#b0e65a; --teal-dim:#5f8a24; --on-accent:#162205;}
:root[data-theme="light"][data-accent="sky"]    {--accent-rgb:14,116,184;  --teal:#0e74b8; --teal-dim:#8cc3e6; --on-accent:#fff;}
:root[data-theme="light"][data-accent="violet"] {--accent-rgb:112,72,210;  --teal:#7048d2; --teal-dim:#c3b0f0; --on-accent:#fff;}
:root[data-theme="light"][data-accent="lime"]   {--accent-rgb:74,124,20;   --teal:#4a7c14; --teal-dim:#b6d88a; --on-accent:#fff;}
/* Text size */
:root[data-size="compact"]{--fs-1:10px;--fs-2:11.5px;--fs-3:13px;--fs-4:15px;--fs-5:18px;--fs-6:23px;--fs-7:30px;}
:root[data-size="large"]  {--fs-1:12.5px;--fs-2:14px;--fs-3:16px;--fs-4:18px;--fs-5:22px;--fs-6:29px;--fs-7:38px;}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important;}
/* The wordmark is teal on transparent; darken it enough to read on white. */
.wordmark{display:block;height:30px;width:auto;max-width:100%}
:root[data-theme="light"] .wordmark{filter:brightness(.62) saturate(1.3)}

/* ---- player banner ---- */
.pbanner{position:relative;border-radius:18px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;flex-wrap:wrap;color:#fff;border:1px solid rgba(255,255,255,.12);overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25);background-size:auto;}
.pbanner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 55%);pointer-events:none}
.pbanner > *{position:relative;z-index:1}
.pbanner{min-height:148px}
.pbanner.small{min-height:0}
/* the legendary banner moves: a slow sheen sweeps across it */
.shine{position:relative;overflow:hidden}
.shine::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(170,255,235,.22) 48%,rgba(200,170,255,.18) 52%,transparent 65%);
  background-size:260% 100%;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
:root[data-motion="reduced"] .shine::before{animation:none;opacity:0}
.bn-tile{height:104px}
/* ---- avatar borders ---- */
.pb-ring{padding:0;background:none}
.br-frame{position:relative;display:inline-grid;place-items:center;padding:var(--pad);border-radius:50%;flex:none;
  box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 0 18px -2px var(--glow, transparent)}
.br-ring{position:absolute;inset:0;border-radius:50%;z-index:0}
.br-frame.br-spinning .br-ring{animation:brspin 6s linear infinite}
@keyframes brspin{to{transform:rotate(360deg)}}
.br-frame > .avatar{position:relative;z-index:1;border:2px solid rgba(0,0,0,.45)}
.br-deco{position:absolute;z-index:2;pointer-events:none}
.br-deco.crown{width:46%;top:-26%;left:27%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.br-deco.stars{inset:-10%}
.br-deco.stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#e8fbff;box-shadow:0 0 8px 2px #6af0ff;animation:twinkle 2.4s ease-in-out infinite}
.br-deco.stars i:nth-child(1){top:4%;right:14%}
.br-deco.stars i:nth-child(2){bottom:10%;left:2%;animation-delay:.8s}
.br-deco.stars i:nth-child(3){top:40%;right:-2%;width:4px;height:4px;animation-delay:1.5s}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
:root[data-motion="reduced"] .br-frame.br-spinning .br-ring,:root[data-motion="reduced"] .br-deco.stars i{animation:none}
.br-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.br-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:42px 10px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2);transition:border-color .15s,transform .15s}
.br-tile:hover{border-color:rgba(var(--accent-rgb),.45)}
.br-tile.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-ghost)}
.br-tile.locked .br-frame{filter:grayscale(1) brightness(.7)}
.br-tile.locked{cursor:default}
.br-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.35)}
.br-name{font-weight:700;font-size:var(--fs-2)}
/* ---- name styles ---- */
.pb-name[class*="ns-"]{line-height:1.15;padding:2px 0}
.pb-name.ns-mint{color:#7ff5de}
.pb-name.ns-modern{font-family:"Space Grotesk",sans-serif;letter-spacing:-.01em;color:#dff4ff}
.pb-name.ns-hand{font-family:"Caveat",cursive;font-size:calc(var(--fs-5) * 1.3);letter-spacing:0;color:#fff2dc;font-weight:700}
.pb-name.ns-scholar{font-family:"Playfair Display",serif;font-style:italic;letter-spacing:0;color:#f3e2b8}
.pb-name.ns-sunset,.pb-name.ns-blaze,.pb-name.ns-glacial,.pb-name.ns-royal,.pb-name.ns-aurora{-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
.pb-name.ns-sunset{background-image:linear-gradient(90deg,#ffd27a,#ff7e6b 55%,#e06bd1)}
.pb-name.ns-terminal{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:0;color:#6bff9a;text-shadow:0 0 8px rgba(107,255,154,.55)}
.pb-name.ns-terminal::after{content:"_";animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.pb-name.ns-neon{font-family:"Orbitron",sans-serif;letter-spacing:.04em;color:#ffe6fb;
  text-shadow:0 0 4px #fff,0 0 10px #ff4fd8,0 0 22px #ff4fd8,0 0 38px #b000ff;animation:flicker 5s infinite}
@keyframes flicker{0%,19%,21%,62%,64%,100%{opacity:1}20%,63%{opacity:.55}}
.pb-name.ns-arcade{font-family:"Press Start 2P",monospace;font-size:calc(var(--fs-5) * .72);letter-spacing:0;line-height:1.5;
  color:#ffe066;text-shadow:3px 3px 0 #d6336c,6px 6px 0 rgba(0,0,0,.35)}
.pb-name.ns-blaze{font-family:"Bungee",sans-serif;letter-spacing:.02em;font-weight:400;
  background-image:linear-gradient(0deg,#b3200f,#ff7a1a 45%,#ffdf6b 80%,#fff6c2);background-size:100% 200%;animation:blaze 1.6s ease-in-out infinite alternate}
@keyframes blaze{from{background-position:0 0}to{background-position:0 100%}}
.pb-name.ns-glacial{font-family:"Cinzel",serif;letter-spacing:.06em;
  background-image:linear-gradient(100deg,#e6fbff 20%,#62c6f0 40%,#ffffff 50%,#62c6f0 60%,#e6fbff 80%);background-size:250% 100%;animation:glint 4.5s linear infinite}
.pb-name.ns-royal{font-family:"Cinzel",serif;letter-spacing:.06em;
  background-image:linear-gradient(100deg,#c9901c 20%,#ffe08a 40%,#fff6d6 50%,#ffe08a 60%,#c9901c 80%);background-size:250% 100%;animation:glint 3.5s linear infinite;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.55)) drop-shadow(0 0 10px rgba(255,214,107,.35))}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}
.pb-name.ns-aurora{background-image:linear-gradient(90deg,#37ffd0,#6af0ff,#9b7bff,#ff8ad8,#37ffd0);background-size:300% 100%;animation:auroraName 6s linear infinite;
  filter:drop-shadow(0 0 10px rgba(106,240,255,.55)) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
@keyframes auroraName{from{background-position:0 0}to{background-position:300% 0}}
:root[data-motion="reduced"] [class*="ns-"],:root[data-motion="reduced"] .ns-terminal::after{animation:none!important}
.ns-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ns-tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:34px 12px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2);transition:border-color .15s}
.ns-tile:hover{border-color:rgba(var(--accent-rgb),.45)}
.ns-tile.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.ns-tile.locked{cursor:default}
.ns-tile.locked .ns-stage{filter:grayscale(1) brightness(.75)}
.ns-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.35)}
.ns-stage{display:flex;align-items:center;min-height:62px;padding:10px 12px;border-radius:10px;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#062420,#0b3a33 60%,#0a1f2e)}
.ns-stage .pb-name{font-size:var(--fs-4)}
.ns-stage .pb-name.ns-hand{font-size:calc(var(--fs-4) * 1.3)}
.ns-stage .pb-name.ns-arcade{font-size:calc(var(--fs-4) * .72)}
/* ---- teacher identity: quiet and professional ---- */
.pbanner.pb-teacher{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.18)}
.pbanner.pb-teacher::after{background:none}
.pbanner.pb-light{color:#1a1f24;border-color:rgba(0,0,0,.08)}
.pbanner.pb-light .pb-name{color:#15191d;text-shadow:none}
.pbanner.pb-light .pb-sub{color:#4d5761}
.pbanner.pb-inset{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 7px #0b0b0c,inset 0 0 0 8px rgba(255,255,255,.1)}
.bn-tile.t-tile{height:88px}
.bn-tile.light .bn-name{color:#15191d;text-shadow:none}
.br-frame.br-double{background:none}
.br-frame.br-double .br-ring{box-shadow:inset 0 0 0 2px #e9ecef;background:transparent!important}
.br-frame.br-double::after{content:"";position:absolute;inset:calc(var(--pad) - 4px);border-radius:50%;box-shadow:inset 0 0 0 1.5px #e9ecef;z-index:0}
.br-frame.br-none{box-shadow:none}
.pb-name.ns-t-standard{font-weight:700;letter-spacing:-.01em}
.pb-name.ns-t-serif{font-family:"Playfair Display",Georgia,serif;font-style:normal;font-weight:700;letter-spacing:0}
.pb-name.ns-t-caps{text-transform:uppercase;letter-spacing:.14em;font-size:calc(var(--fs-5) * .78);font-weight:700}
.pb-name.ns-t-light{font-weight:500;letter-spacing:-.02em}
.pb-name.ns-t-grotesk{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.01em}
.pb-name.ns-t-mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;letter-spacing:0;font-size:calc(var(--fs-5) * .88)}
.ns-stage.t-stage{background:linear-gradient(135deg,#1b242e,#232f3b)}
.ns-stage.t-stage .pb-name{color:#f2f4f6;text-shadow:none}
/* ---- test builder and papers, laid out like a form ---- */
.form-head{border-top:4px solid var(--teal);padding:24px}
.q-card{padding:24px}
.q-num{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.opt-row{display:flex;align-items:center;gap:10px;margin-top:8px}
.opt-radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer}
.opt-radio.on{border-color:var(--teal);box-shadow:inset 0 0 0 4px var(--teal)}
.opt-pick{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-top:8px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-size:var(--fs-3);color:var(--ink);transition:all .15s}
.opt-pick:hover{border-color:rgba(var(--accent-rgb),.45)}
.opt-pick.on{border-color:var(--teal);background:var(--teal-ghost)}
/* ---- teaching assistant ---- */
.ta-wrap{display:block}
.only-narrow{display:none}
@media (max-width:1180px){ .only-narrow{display:block} }
.mem-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.mem-item{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line-soft)}
.mem-dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--teal)}
.mem-dot.you{background:var(--ink-2)}
.mem-note{flex:1;font-size:var(--fs-2);line-height:1.5}
.mem-x{flex:none;color:var(--mute);font-size:12px;padding:2px 4px;border-radius:6px}
.mem-x:hover{color:var(--ink);background:var(--panel2)}
.mem-add{display:flex;gap:8px;margin-top:12px}
.mem-add input{padding:9px 12px}

.ns-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-2)}
.bn-rar{position:absolute;top:9px;right:10px;font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.5)}
.bn-tile.r-legendary{box-shadow:0 0 0 1px rgba(255,224,138,.45),0 0 22px -6px rgba(255,224,138,.6)}
.bn-tile.r-legendary.locked{box-shadow:0 0 0 1px rgba(255,224,138,.25)}
.bn-tile .bn-name{position:relative}
.legend-hint{border-color:rgba(255,224,138,.35)}
.pb-left{display:flex;align-items:center;gap:14px;min-width:0}
.pb-ring{padding:3px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.25));flex:none}
.pb-ring .avatar{border:2px solid rgba(0,0,0,.35);background:#0d1d1a;color:#fff}
.pb-name{font-size:var(--fs-5);font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:var(--fs-2);color:rgba(255,255,255,.78)}
.pb-stat{display:inline-block;margin-top:6px;font-size:var(--fs-1);font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(0,0,0,.35);color:#fff}
.pb-badges{display:flex;gap:10px}
.pb-slot{width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:rgba(0,0,0,.28);
  border:1px solid rgba(255,255,255,.14)}
.pb-slot span{font-size:10px;font-weight:700;text-align:center;line-height:1.2;color:#fff}
.pb-slot.empty{border-style:dashed;justify-content:center;min-height:78px}
.pb-slot.empty span{color:rgba(255,255,255,.5)}
.pbanner.small{padding:12px 14px;border-radius:14px}
.pbanner.small .pb-name{font-size:var(--fs-4)}
.pbanner.small .pb-slot{width:54px;padding:5px 3px}
.pbanner.small .pb-slot span{display:none}
.pbanner.small .pb-slot.empty{min-height:48px}
@media (max-width:600px){ .pb-badges{width:100%;justify-content:space-between} .pb-slot{flex:1;width:auto} }
/* ---- customiser ---- */
.bn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.bn-tile{position:relative;height:84px;border-radius:14px;border:2px solid transparent;text-align:left;padding:10px;color:#fff;overflow:hidden}
.bn-tile.on{border-color:var(--teal)}
.bn-tile.locked{filter:saturate(.35) brightness(.7)}
.bn-name{font-weight:800;font-size:var(--fs-3);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.bn-lock{position:absolute;left:10px;bottom:9px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 10px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--bg2)}
.bd-card.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-ghost)}
.bd-card.locked{cursor:default}
.bd-name{font-weight:700;font-size:var(--fs-2)}
.bd-tier{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}

/* ================= form controls (all screens) =================
   Inputs with no type attribute weren't matched before and rendered as
   unstyled grey browser boxes. */
input:not([type]),input[type=text],input[type=email],input[type=url],input[type=search],input[type=password],input[type=number],select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  color:var(--ink);font:inherit;font-size:var(--fs-2);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
input::placeholder,textarea::placeholder{color:var(--mute)}
input[type=file]{font:inherit;font-size:var(--fs-2);color:var(--mute);max-width:100%}
input[type=file]::file-selector-button{font:inherit;font-weight:700;font-size:var(--fs-2);margin-right:10px;padding:8px 13px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.btn{white-space:nowrap}
.chip{white-space:nowrap}

/* ================= "More" sheet ================= */
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.sheet-back.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);border-top:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .18s ease-out;max-height:80vh;overflow:auto}
.sheet.open{transform:none}
.sheet-grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 12px}
.sheet-who{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;border-bottom:1px solid var(--line-soft);margin-bottom:6px}
.sheet a{display:flex;align-items:center;gap:13px;padding:14px 10px;border-radius:12px;font-weight:600;color:var(--ink-2);font-size:var(--fs-3)}
.sheet a.on{background:var(--teal-ghost);color:var(--teal)}
.sheet-out{width:100%;margin-top:8px;padding:14px;border-radius:12px;border:1px solid var(--line);font-weight:700;color:var(--ink-2)}

/* ================= phones ================= */
@media (max-width:860px){
  /* iOS zooms into any field under 16px when tapped; this stops that. */
  input:not([type=file]),select,textarea{font-size:16px}
  /* Belt and braces against a stray pixel of sideways scroll. "clip", unlike
     "hidden", doesn't turn body into a scroll box, so sticky headers keep working. */
  html,body{overflow-x:clip}

  .main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
  .mobiletop{position:sticky;top:0;z-index:15;margin:-14px -14px 14px;padding:10px 14px;
    background:var(--bar);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* bottom bar: bigger targets, labels that never wrap */
  .mobilebar{padding:6px 4px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .mobilebar a{min-height:50px;justify-content:center;border-radius:12px;font-size:10.5px}
  .mobilebar a span{white-space:nowrap}
  .mobilebar a.on{background:var(--teal-ghost)}

  /* headings: title on its own line, actions underneath when they don't fit */
  .topbar{flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .topbar > div:first-child{flex:1 1 230px;min-width:0}
  .h1{font-size:var(--fs-6);word-break:break-word}
  .crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* stat tiles two-up instead of one tall column; an odd one out spans the row */
  .grid.g3:has(> .stat),.grid.g4:has(> .stat){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .grid.g3 > .stat:last-child:nth-child(odd),.grid.g4 > .stat:last-child:nth-child(odd){grid-column:1 / -1}
  .stat{padding:11px 12px}
  .stat .v{font-size:var(--fs-5)}

  /* touch targets: 40px minimum */
  .btn{min-height:40px}
  .btn.sm{min-height:36px;padding:8px 13px}
  .tabs button{padding:9px 15px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-2px;padding:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .list .item{padding:12px 10px}
  .suggests button{padding:9px 13px}

  /* rows that must be allowed to break */
  .wrap-sm{flex-wrap:wrap}
  .wrap-sm > :last-child{margin-left:auto}
  .wrap-sm > .row:first-child{flex-wrap:nowrap;min-width:0;flex:1 1 200px}
  .topbar > .avatar{display:none}   /* already in the phone header */

  /* Edu AI: the message box stays above the tab bar while you scroll */
  .composer{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:5;margin:16px -14px 0;padding:10px 14px;
    background:var(--bar);border-top:1px solid var(--line-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .msg{max-width:88%}

  .cmp{grid-template-columns:1fr}
  /* long answer options and full-width buttons must wrap, not push off-screen */
  .grid > .btn,.btn[style*="text-align:left"]{white-space:normal;line-height:1.4;padding-top:11px;padding-bottom:11px}
  .suggests button{min-height:38px}
  /* small labels that were under 11px */
  .pb-slot span,.bd-tier,.bn-lock{font-size:11px}
  .note{font-size:max(var(--fs-1),11.5px)}
  .card{padding:14px}
  .prose{font-size:15px;line-height:1.7}
}
@media (max-width:400px){
  .h1{font-size:var(--fs-5)}
  .pb-slot{padding:6px 2px}
}

.upgrade-link{color:#ff8ae4!important}
.upgrade-link:hover{background:rgba(255,82,217,.12)!important}
/* ---- calendar ---- */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal-day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:7px}
.cal-day.today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.cal-dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
.cal-dayhead b{font-size:var(--fs-2);letter-spacing:.06em;text-transform:uppercase}
.cal-dayhead span{font-size:var(--fs-4);font-weight:800;color:var(--mute)}
.cal-slot{font-size:var(--fs-1);color:var(--ink-2);background:var(--bg2);border-radius:8px;padding:6px 8px;line-height:1.35}
.cal-slot b{color:var(--ink)}
.cal-ev{display:block;width:100%;text-align:left;font-size:var(--fs-1);line-height:1.35;padding:7px 9px;border-radius:8px;
  border:1px solid var(--line);background:var(--teal-ghost);color:var(--ink)}

.cal-dow{font-size:var(--fs-1);color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 2px}
.cal-cell{min-height:104px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:4px}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--teal)}
.cal-date{font-size:var(--fs-2);font-weight:700;color:var(--mute)}
.cal-dot{display:block;width:100%;text-align:left;font-size:10.5px;line-height:1.3;padding:4px 6px;border-radius:6px;
  background:var(--teal-ghost);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-exam,.k-deadline{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.k-study{background:rgba(var(--accent-rgb),.16)}

@media (max-width:860px){

  .cal-day{min-height:0}

/* ---- settings ---- */
.set-wrap{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.set-nav button{text-align:left;padding:11px 14px;border-radius:10px;color:var(--ink-2);font-weight:600;font-size:var(--fs-3)}
.set-nav button:hover{background:var(--panel)}
.set-nav button.on{background:var(--teal-ghost);color:var(--teal)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.set-row + .set-row{border-top:1px solid var(--line-soft)}
.set-title{font-size:var(--fs-3);font-weight:600}
.sw{flex:none;width:50px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.sw span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-2);transition:transform .15s,background .15s}
.sw.on{background:var(--teal)}
.sw.on span{transform:translateX(22px);background:var(--on-accent)}
.card.danger{border-color:var(--warn-line);background:var(--warn-soft)}
@media (max-width:860px){
  .set-wrap{grid-template-columns:1fr;gap:14px}
  .set-nav{flex-direction:row;overflow-x:auto;position:static;gap:8px;padding-bottom:4px;scrollbar-width:none}
  .set-nav::-webkit-scrollbar{display:none}
  .set-nav button{flex:none;border:1px solid var(--line);border-radius:99px;padding:9px 15px;font-size:var(--fs-2)}
  .set-row{flex-wrap:wrap}
}
/* ---- accessibility preferences ---- */
:root[data-contrast="high"]{--ink:#ffffff;--ink-2:#dcefea;--mute:#b6cfc9;--line:#3a6f65;--line-soft:#27524a}
:root[data-contrast="high"][data-theme="light"]{--ink:#000;--ink-2:#1d3a34;--mute:#2f4f49;--line:#7fa79f;--line-soft:#9dbdb6}
:root[data-contrast="high"] .note{color:var(--ink-2)}
:root[data-contrast="high"] .card,:root[data-contrast="high"] .stat{border-width:2px}
:root[data-font="reading"] body,:root[data-font="reading"] input,:root[data-font="reading"] textarea,
:root[data-font="reading"] select,:root[data-font="reading"] button{font-family:Verdana,Tahoma,"DejaVu Sans",sans-serif;letter-spacing:.01em}
:root[data-font="reading"] .prose{line-height:1.85;word-spacing:.08em}
:root[data-density="compact"] .card{padding:12px}
:root[data-density="compact"] .lens-card,:root[data-density="compact"] .q-card{padding:14px}
:root[data-density="compact"] .sec{margin:18px 0 9px}
:root[data-density="compact"] .list .item{padding:8px 10px}
:root[data-density="compact"] .set-row{padding:10px 0}
:root[data-density="compact"] .grid{gap:10px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:9px;padding:9px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--bg2);font-size:var(--fs-2);font-weight:600;color:var(--ink-2)}
.swatch.on{border-color:var(--teal);color:var(--ink);box-shadow:0 0 0 1px var(--teal) inset}
.swatch i{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.preview{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:var(--fs-3);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(900px 500px at 12% -10%,rgba(var(--accent-rgb),.07),transparent 60%),
    radial-gradient(700px 400px at 100% 100%,rgba(var(--accent-rgb),.05),transparent 60%);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ---------- shell ---------- */
.app{position:relative;z-index:1;display:grid;grid-template-columns:232px minmax(0,1fr) 312px;min-height:100vh;}
.side{border-right:1px solid var(--line-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;}
.brand b{font-size:var(--fs-4);font-weight:800;letter-spacing:-.02em;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:600;font-size:var(--fs-3);}
.nav a:hover{background:var(--panel);color:var(--ink);}
.nav a.on{background:var(--teal-ghost);color:var(--teal);}
.nav-sep{height:1px;background:var(--line);margin:10px 12px;}
.nav-label{margin:18px 12px 6px;font-size:var(--fs-1);color:var(--mute);font-weight:600;}
.side-foot{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:12px;}

.main{min-width:0;padding:26px 30px 90px;}
.aside{border-left:1px solid var(--line-soft);padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto;}

.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:22px;}
.h1{font-size:var(--fs-7);font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1;}
.h2{font-size:var(--fs-5);font-weight:700;letter-spacing:-.02em;margin:0 0 12px;}
.sub{color:var(--mute);font-size:var(--fs-2);margin-top:5px;}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--teal);font-size:var(--fs-2);flex:none;}

/* ---------- pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;}
.card.flat{background:var(--bg2);}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.g4{grid-template-columns:repeat(4,minmax(0,1fr));}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;}
.stat .k{font-size:var(--fs-2);color:var(--mute);}
.stat .v{font-size:var(--fs-6);font-weight:700;letter-spacing:-.02em;margin-top:2px;}
.stat.warn{border-color:var(--warn-line);background:var(--warn-soft);}
.stat.warn .v{color:var(--warn);}

.bar{height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;}
.bar.warn i{background:var(--warn);}
.pct{font-variant-numeric:tabular-nums;font-weight:700;}
.pct.warn{color:var(--warn);}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--bg2);font-size:var(--fs-1);color:var(--ink-2);}
.chip.teal{border-color:rgba(var(--accent-rgb),.4);color:var(--teal);background:var(--teal-ghost);}
.chip.warn{border-color:var(--warn-line);color:var(--warn);background:var(--warn-soft);}

.tag{display:inline-flex;padding:2px 7px;border-radius:5px;font-size:var(--fs-1);font-weight:700;letter-spacing:.02em;}
.tag.gap{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line);}
.tag.slip{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}
.tag.pace{background:var(--panel2);color:var(--ink-2);border:1px solid var(--line);}
.tag.prereq{background:var(--teal-ghost);color:var(--teal);border:1px solid rgba(47,227,192,.4);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 15px;border-radius:var(--r-sm);
  background:var(--teal);color:var(--on-accent);font-weight:700;font-size:var(--fs-2);}
.btn:hover{filter:brightness(1.07);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{background:var(--panel2);}
.btn.sm{padding:7px 12px;font-size:var(--fs-1);}
.btn[disabled]{opacity:.55;cursor:default;filter:none;}

.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.tabs button{padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);font-size:var(--fs-2);font-weight:600;}
.tabs button.on{background:var(--teal);border-color:var(--teal);color:var(--on-accent);}

.list{display:flex;flex-direction:column;}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:var(--r-sm);}
.list .item + .item{border-top:1px solid var(--line-soft);}
.item.on{background:var(--teal-ghost);}
.item.locked{color:var(--mute);}
.done{color:var(--teal);}

.ai{border:1px solid rgba(var(--accent-rgb),.32);background:linear-gradient(180deg,rgba(var(--accent-rgb),.08),rgba(var(--accent-rgb),.02));
  border-radius:var(--r);padding:14px;}
.ai .who{display:flex;align-items:center;gap:7px;color:var(--teal);font-weight:700;font-size:var(--fs-2);margin-bottom:7px;}
.ai p{margin:0 0 10px;font-size:var(--fs-2);color:var(--ink);line-height:1.55;}

.note{font-size:var(--fs-1);color:var(--mute);}
.sec{margin:26px 0 12px;font-size:var(--fs-2);color:var(--mute);font-weight:600;}
.sec:first-child{margin-top:0;}
.divider{height:1px;background:var(--line-soft);margin:14px 0;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:var(--fs-2);}
.kv + .kv{border-top:1px solid var(--line-soft);}
.kv span:first-child{color:var(--mute);}
.crumb{font-size:var(--fs-2);color:var(--mute);margin-bottom:10px;}
.crumb a:hover{color:var(--teal);}
.warn-text{color:var(--warn);}
.teal-text{color:var(--teal);}
.mono{font-variant-numeric:tabular-nums;}

/* counsellor */
.chat{display:flex;flex-direction:column;gap:14px;}
.msg{max-width:76%;padding:12px 14px;border-radius:var(--r);font-size:var(--fs-2);line-height:1.6;}
.msg.me{align-self:flex-end;background:var(--teal);color:var(--on-accent);font-weight:600;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg.ai .evidence{margin:10px 0;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--bg2);}
.sources{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.composer{display:flex;gap:9px;margin-top:16px;}
.composer input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:12px 16px;color:var(--ink);font:inherit;font-size:var(--fs-2);}
.composer input::placeholder{color:var(--mute);}
.suggests{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.suggests button{padding:7px 12px;border:1px solid var(--line);border-radius:99px;font-size:var(--fs-1);color:var(--ink-2);}
.suggests button:hover{border-color:var(--teal);color:var(--teal);}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:3px;animation:blink 1.2s infinite;}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* examlens question map */
.qmap{display:flex;gap:7px;flex-wrap:wrap;}
.q{width:52px;padding:6px 4px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg2);text-align:center;}
.q b{display:block;font-size:var(--fs-3);}
.q small{font-size:10px;color:var(--mute);}
.q.partial{border-color:rgba(240,138,93,.3);}
.q.loss{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn);}
.q.loss small{color:var(--warn);}
.q.on{outline:2px solid var(--teal);}
.legend{display:flex;gap:14px;font-size:var(--fs-1);color:var(--mute);margin-top:10px;flex-wrap:wrap;}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;}

/* answer compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cmp .box{border-radius:var(--r-sm);padding:10px;font-size:var(--fs-2);}
.cmp .yours{background:var(--warn-soft);border:1px solid var(--warn-line);}
.cmp .right{background:var(--teal-ghost);border:1px solid rgba(var(--accent-rgb),.3);}
.cmp .lbl{font-size:var(--fs-1);color:var(--mute);margin-bottom:4px;}

/* mobile */
.mobilebar{display:none;}
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr);}
  .aside{display:none;}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .side{display:none;}

/* ---------- the genome, computed from real evidence ---------- */
const WEIGHTS = { test:30, paper:22, examlens:18, mirage:18, quiz:14, doctor:10, lesson:6 };
const HALF_LIFE_DAYS = 60;
function genomeFrom(attempts){
  const now=Date.now(), map={};
  attempts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    const t = map[a.topic] ||= {topic:a.topic, subject:a.subject||"", num:0, den:0, n:0, last:a.created_at};
    t.num += Number(a.score)*w*decay; t.den += w*decay; t.n++;
    if(new Date(a.created_at) > new Date(t.last)) t.last = a.created_at;
  });
  const topics = Object.values(map).map(t=>({
    topic:t.topic, subject:t.subject, evidence:t.n, last:t.last,
    score: Math.round(t.num/t.den),
    confidence: Math.min(100, Math.round(t.den/60*100))
  })).sort((a,b)=>a.score-b.score);
  const overall = topics.length ? Math.round(topics.reduce((s,t)=>s+t.score,0)/topics.length) : null;
  return { topics, overall, weakest: topics[0]||null, strongest: topics[topics.length-1]||null };
}
const G = () => genomeFrom(S.attempts);

/* One weighted score for any bundle of attempts. */
function scoreOf(atts){
  const now = Date.now(); let num=0, den=0, last=0;
  atts.forEach(a=>{
    const w = WEIGHTS[a.kind] ?? 10;
    const decay = Math.pow(0.5, ((now-new Date(a.created_at))/86400000)/HALF_LIFE_DAYS);
    num += Number(a.score)*w*decay; den += w*decay;
    last = Math.max(last, new Date(a.created_at).getTime());
  });
  return { score: den ? Math.round(num/den) : null, evidence: atts.length,
           confidence: Math.min(100, Math.round(den/60*100)), last };
}
/* Group attempts into the nodes one ring of the genome shows. */
function nodesBy(atts, keyFn){
  const map = {};
  atts.forEach(a=>{ const k = keyFn(a) || "Unsorted"; (map[k] ||= []).push(a); });
  return Object.entries(map).map(([name, rows])=>({ name, ...scoreOf(rows) }))
    .sort((a,b)=>a.score-b.score);
}

async function ai(task, payload){

    throw new Error(out.error);
  }
  return out;
}

/* Shrink a photo before it goes over the wire — phone camera photos are often
   4-8MB, and Groq's vision model only reads up to 20MB and pays per-image in
   fixed tokens regardless of resolution, so there's nothing gained by full size. */
function fileToCompressedDataURL(file, maxDim = 1600, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: h } = img;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale); h = Math.round(h * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Could not read that photo"));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error("Could not read that photo"));
    reader.readAsDataURL(file);
  });
}

function celebrateBadge(b){
  return new Promise(resolve=>{
    const t = TIERS[b.tier] || TIERS.common;
    const el = document.createElement("div");
    el.className = "badge-fx";
    el.style.setProperty("--bfx-a", t.a);

      <p class="badge-fx-desc">${esc(b.desc)}</p>
      <div class="badge-fx-tap">Equip it from your profile · tap to continue</div>`;
    document.body.appendChild(el);
    let done = false;
    const finish = () => {
      if(done) return; done = true;
      el.classList.remove("show");
      setTimeout(() => { el.remove(); resolve(); }, 300);
    };
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
    el.addEventListener("click", finish);
    setTimeout(finish, 3600);
  });
}
/* Celebrate anything newly earned since this browser last looked. "Seen" is kept per

    try{ seen = JSON.parse(localStorage.getItem(key)); }catch(e){}

    const fresh = earned.filter(b=>!seen.includes(b.id));
    try{ localStorage.setItem(key, JSON.stringify(earned.map(b=>b.id))); }catch(e){}
    for(const b of fresh) await celebrateBadge(b);
  } finally { unlockBusy = false; }
}

const barRow = (label,v,weak,sub)=>`
  <div style="padding:9px 0">

      <div><div style="font-size:var(--fs-2);font-weight:600">${esc(label)}</div>${sub?`<div class="note">${esc(sub)}</div>`:""}</div>

    <div class="bar ${weak?"warn":""}"><i style="width:${v||0}%"></i></div></div>`;
/* Radar web. Nodes are clickable when there's a level below them. */
function web(items, drillTo){
  const n = items.length;
  if(n < 3) return `<div class="card flat"><div class="note">A web needs at least three points to be worth drawing.
    ${n===0?"Nothing here yet.":"There "+(n===1?"is one":"are two")+" here, shown below instead."}</div></div>`;
  /* Wider canvas, labels anchored away from the centre and wrapped onto two lines,
     so long topic names don't run off the edge of a phone screen. */
  const W=420, cx=210, cy=168, R=90;
  const pt=(i,r)=>[cx+r*Math.cos(-Math.PI/2+i*2*Math.PI/n), cy+r*Math.sin(-Math.PI/2+i*2*Math.PI/n)];
  const wrap = name => {
    const words = name.split(/\s+/), lines = [""];
    words.forEach(w=>{ const cur = lines[lines.length-1];
      if((cur+" "+w).trim().length <= 13 || !cur) lines[lines.length-1] = (cur+" "+w).trim(); else lines.push(w); });
    if(lines.length > 2){ lines.length = 2; lines[1] = lines[1].slice(0,11)+"…"; }
    return lines.map(l=> l.length>14 ? l.slice(0,13)+"…" : l);
  };
  const rings=[25,50,75,100].map(p=>`<polygon points="${items.map((_,i)=>pt(i,R*p/100).join(",")).join(" ")}"
      fill="none" stroke="var(--line)"/>`).join("");
  const spokes=items.map((_,i)=>{const [x,y]=pt(i,R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join("");
  const shape=items.map((t,i)=>pt(i,R*(t.score||0)/100).join(",")).join(" ");
  const parts=items.map((t,i)=>{
    const [dx,dy]=pt(i,R*(t.score||0)/100);
    const [lx,ly]=pt(i,R+14);
    const side = lx - cx;
    const anchor = Math.abs(side) < 12 ? "middle" : side > 0 ? "start" : "end";
    const lines = wrap(t.name);
    const top = ly < cy - R*0.6 ? ly - 15*lines.length : ly > cy + R*0.6 ? ly + 12 : ly - 7*(lines.length-1);
    const weak = t.score!==null && t.score<60;
    const click = drillTo ? `data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer"` : "";
    return `<g ${click}>
      <circle cx="${dx}" cy="${dy}" r="4.5" fill="${weak?"var(--warn)":"var(--teal)"}"/>
      <circle cx="${lx}" cy="${ly}" r="30" fill="transparent"/>
      <text text-anchor="${anchor}" font-size="13.5" fill="${weak?"var(--warn)":"var(--ink-2)"}">
        ${lines.map((l,k)=>`<tspan x="${lx}" y="${top+k*15}">${esc(l)}</tspan>`).join("")}
        <tspan x="${lx}" y="${top+lines.length*15+1}" font-weight="700" fill="${weak?"var(--warn)":"var(--teal)"}">${t.score===null?"—":t.score+"%"}</tspan>
      </text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} 345" role="img" aria-label="Genome web" style="width:100%;max-width:460px">
    ${rings}${spokes}
    <polygon points="${shape}" fill="rgba(var(--accent-rgb),.15)" stroke="var(--teal)" stroke-width="1.6"/>
    ${parts}
    <text x="${cx}" y="340" font-size="9.5" text-anchor="middle" fill="var(--mute)">Rings mark 25, 50, 75 and 100 percent</text>
  </svg>`;
}

    const ls = S.lessons.filter(l=>l.course_id===c.id && l.published);

    return `<div class="card">
      <div class="between"><div><div style="font-weight:700">${esc(c.title)}</div>
        <div class="note">${esc(c.subject)}${c.code?" · "+esc(c.code):""} · ${ls.length} lesson${ls.length===1?"":"s"}</div></div>
        ${joined?`<span class="chip teal">${ls.length?Math.round(done/ls.length*100):0}% done</span>`:`<button class="btn sm" data-act="join" data-id="${c.id}">Join</button>`}</div>
      ${c.description?`<p class="note" style="margin:9px 0 0">${esc(c.description)}</p>`:""}
      ${joined?`<div class="bar" style="margin-top:11px"><i style="width:${ls.length?done/ls.length*100:0}%"></i></div>
        <div style="margin-top:11px"><a class="btn ghost sm" href="#/course/${c.id}">Open course</a></div>`:""}
    </div>`;
  };

  <div class="topbar"><div><h1 class="h1">Learn</h1>

          : "No teacher at your school has published a course yet. When one does, it appears here — press Refresh if you're waiting on it.")}

V.genome = () => {
  const sub = S.gSubject, top = S.gTopic;
  const all = S.attempts;
  if(!all.length) return `
    <div class="topbar"><div><h1 class="h1">Learning genome</h1>
      <div class="sub">Built from your own graded work</div></div>
      <a class="btn ghost sm" href="#/weights">How is this scored?</a></div>
    ${empty("Nothing to model yet",
      "The genome needs evidence before it can say anything true about you. A lesson checkpoint, an ExamLens analysis or a Mirage run will start it off.",
      `<a class="btn" href="#/learn">Go to Learn</a>`)}`;

  const enc = encodeURIComponent;
  let level, items, atts, crumb, title, caption, drillTo;

  if(!sub){
    level = "subject"; atts = all;
    items = nodesBy(atts, a=>a.subject);
    title = "Learning genome";
    caption = "Each strand is a subject. Click one to open its topics.";
    crumb = "";
    drillTo = t => `#/genome/${enc(t.name)}`;
  } else if(!top){
    level = "topic"; atts = all.filter(a=>(a.subject||"Unsorted")===sub);
    items = nodesBy(atts, a=>a.topic);
    title = sub;
    caption = "Each strand is a topic in this subject. Click one to open its lessons.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · ${esc(sub)}</div>`;
    drillTo = t => `#/genome/${enc(sub)}/${enc(t.name)}`;
  } else {
    level = "lesson"; atts = all.filter(a=>(a.subject||"Unsorted")===sub && a.topic===top);
    items = nodesBy(atts, a=> a.lesson_id ? (lessonName(a.lesson_id) || "Lesson") : ({
      examlens:"ExamLens analysis", mirage:"Mirage run", paper:"Past paper", test:"Test", quiz:"Quiz"
    }[a.kind] || a.kind));
    title = top;
    caption = "Each strand is one lesson or assessment inside this topic. This is the bottom of the genome.";
    crumb = `<div class="crumb"><a href="#/genome">Genome</a> · <a href="#/genome/${enc(sub)}">${esc(sub)}</a> · ${esc(top)}</div>`;
    drillTo = null;
  }

  const here = scoreOf(atts);
  const weakest = items.filter(i=>i.score!==null)[0];

  return `
  ${crumb}
  <div class="topbar">
    <div><h1 class="h1" style="font-size:${level==="subject"?"var(--fs-7)":"var(--fs-6)"}">${esc(title)}</h1>
      <div class="sub">${caption}</div></div>
    <div class="row" style="gap:8px">
      ${sub?`<a class="btn ghost sm" href="${top?`#/genome/${enc(sub)}`:"#/genome"}">Back</a>`:""}
      <a class="btn ghost sm" href="#/weights">How is this scored?</a></div>
  </div>

  <div class="grid g3">
    <div class="stat"><div class="k">${level==="subject"?"Across everything":level==="topic"?"Subject score":"Topic score"}</div>
      <div class="v">${here.score===null?"—":here.score+"%"}</div>
      <div class="note">${here.evidence} attempt${here.evidence===1?"":"s"}</div></div>
    <div class="stat ${weakest && weakest.score<60?"warn":""}"><div class="k">Weakest strand</div>
      <div class="v" style="font-size:var(--fs-4)">${weakest?esc(weakest.name):"—"}</div>
      <div class="note">${weakest?weakest.score+"%":"nothing yet"}</div></div>
    <div class="stat"><div class="k">Confidence</div><div class="v">${here.confidence}%</div>
      <div class="note">how much evidence is behind this</div></div>
  </div>

  <div class="card" style="margin-top:14px;display:grid;place-items:center">
    ${web(items, drillTo)}
  </div>

  <div class="sec">${level==="subject"?"Subjects":level==="topic"?"Topics":"Lessons and assessments"}</div>
  <div class="card">
    ${items.map(t=>{
      const row = barRow(t.name, t.score, t.score!==null && t.score<60,
        `${t.evidence} attempt${t.evidence===1?"":"s"} · last ${ago(new Date(t.last))}`);
      return drillTo
        ? `<div data-act="drill" data-to="${drillTo(t)}" style="cursor:pointer">${row}</div>`
        : row;
    }).join("")}
  </div>
  ${drillTo?`<div class="note" style="margin-top:10px">Click any strand to go a level deeper.</div>`:
    `<div class="note" style="margin-top:10px">Nothing sits below a lesson. If a strand here is weak, that's the thing to redo.</div>`}

  ${weakest && weakest.score<60 ? `<div class="ai" style="margin-top:14px">
    <div class="who">${I.ai} Edu AI</div>
    <p>${esc(weakest.name)} is the weakest strand here at ${weakest.score}%. Ask me what to do about it and I'll answer from the questions you actually got wrong.</p>
    <a class="btn sm" href="#/counsellor">Ask Edu AI</a></div>` : ""}`;
};

  <div class="topbar"><div><h1 class="h1">How your genome is scored</h1>

/* Score ring used by ExamLens reports. */
function ring(v, size=92){
  const r = 38, c = 2*Math.PI*r, weak = v < 60;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 92 92" role="img" aria-label="${v} percent">
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="46" cy="46" r="${r}" fill="none" stroke="${weak?"var(--warn)":"var(--teal)"}" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.max(0,Math.min(100,v))/100)}" transform="rotate(-90 46 46)"/>
    <text x="46" y="52" text-anchor="middle" font-size="21" font-weight="800" fill="${weak?"var(--warn)":"var(--ink)"}">${v}%</text>
  </svg>`;
}

  e.target.closest(".drop")?.classList.toggle("has", files.length>0);
});

/* ---------- Mirage: genuine vs apparent mastery ---------- */
V.mirage = () => {
  const g = G(), m = S.cache.mirage;
  const d = S.cache.mirageDraft || {};
  const topicOptions = g.topics.map(t=>`<option value="${esc(t.topic)}" ${d.topic===t.topic?"selected":""}>${esc(t.topic)} — ${t.score}%</option>`).join("");
  return `
  <div class="topbar"><div><h1 class="h1">Mirage</h1>
    <div class="sub">Tests the same idea five ways, from the familiar form to the inverse. A score that collapses is memorised, not understood.</div></div></div>
  <div class="card">
    <div class="grid g2">
      <div><label class="f" for="miTopic">Topic</label>
        ${g.topics.length?`<select id="miTopic">${topicOptions}</select>`:`<input id="miTopic" placeholder="Simple harmonic motion" value="${esc(d.topic||"")}">`}</div>
      <div><label class="f" for="miSub">Subject</label><input id="miSub" placeholder="Physics" value="${esc(d.subject || (g.topics[0]?g.topics[0].subject:""))}"></div>
    </div>
    <button class="btn" style="margin-top:14px" data-act="mirage-generate">${busy("mirage","Generate a run")}</button>
  </div>
  ${m && m.questions ? `
    <div class="sec">Run in progress · ${m.questions.length} questions</div>
    <div class="grid" style="gap:12px">
      ${m.questions.map((q,i)=>`<div class="card">
        <div class="between"><span class="chip">${esc(q.label)}</span>
          ${m.results?`<b class="pct ${m.results[i]&&m.results[i].score<60?"warn":""}">${m.results[i]?Math.round(m.results[i].score)+"%":"—"}</b>`:""}</div>
        <p style="margin:10px 0;font-size:var(--fs-2)">${esc(q.question)}</p>
        <textarea id="mi${i}" style="min-height:64px" ${m.results?"disabled":""} placeholder="Answer in a sentence or two">${esc((m.answers&&m.answers[i])||"")}</textarea>
        ${m.results&&m.results[i]?`<div class="note" style="margin-top:8px">${esc(m.results[i].note)}</div>`:""}
      </div>`).join("")}
    </div>
    ${!m.results?`<button class="btn" style="margin-top:14px" data-act="mirage-mark">${busy("mirageMark","Submit run")}</button>`:""}`
   : ""}
  ${m && m.results ? (()=>{
      const lv = n => m.results.find(r=>r.level===n) || {score:0};
      const apparent = Math.round((lv(1).score+lv(2).score)/2);
      const genuine  = Math.round((lv(4).score+lv(5).score)/2);
      return `
      <div class="sec">Verdict</div>
      <div class="grid g3">
        <div class="stat"><div class="k">Apparent mastery</div><div class="v">${apparent}%</div><div class="note">Familiar forms</div></div>
        <div class="stat" style="border-color:rgba(var(--accent-rgb),.4)"><div class="k">Genuine mastery</div>
          <div class="v teal-text">${genuine}%</div><div class="note">New context and inverse</div></div>
        <div class="stat ${apparent-genuine>=25?"warn":""}"><div class="k">Mirage gap</div><div class="v">${apparent-genuine} pts</div>
          <div class="note">${apparent-genuine>=25?"False mastery flagged":"Within tolerance"}</div></div>
      </div>
      <div class="card" style="margin-top:14px;${apparent-genuine>=25?"border-color:var(--warn-line);background:var(--warn-soft)":""}">
        <p class="prose" style="margin:0;font-size:var(--fs-2)">${esc(m.verdict)}</p>
        ${m.root_cause?`<div class="note" style="margin-top:10px">Root cause: ${esc(m.root_cause)}</div>`:""}
      </div>
      <div class="card flat" style="margin-top:12px"><div class="note">Genuine mastery was written to your genome, not the apparent score.</div></div>`;
    })() : ""}`;
};

      <div class="stat"><div class="k">Average score</div><div class="v">${Math.round(session.reduce((s,a)=>s+Number(a.score),0)/session.length)}%</div></div>
      <div class="stat"><div class="k">Avg time</div><div class="v">${avg?avg+"s":"—"}</div></div>
      <div class="stat ${session.filter(a=>a.score<50).length?"warn":""}"><div class="k">Below 50%</div>

/* Chats are created lazily — clicking "New chat" just clears the pane; the
   chat_threads row only gets written once there's actually a first message,
   so browsing away from an unused draft never leaves an empty thread behind. */
async function ensureThread(firstMessage){
  if(S.activeThreadId) return S.activeThreadId;
  const fallback = firstMessage.trim().slice(0,40) + (firstMessage.trim().length>40 ? "…" : "");
  const { data, error } = await sb.from("chat_threads").insert({ student_id:S.me.id, title:fallback }).select().single();
  if(error){ console.warn("Could not create chat thread:", error.message); return null; }
  S.activeThreadId = data.id;
  S.chatThreads.unshift(data);
  /* Upgrade the fallback title to an AI-written one in the background —
     never blocks sending, and a failure here just keeps the fallback. */
  ai("title_chat", { message:firstMessage }).then(out=>{
    const clean = String(out.title||"").trim().slice(0,60);
    if(!clean) return;
    sb.from("chat_threads").update({ title:clean }).eq("id", data.id).then(({error})=>{
      if(error) console.warn("Could not save chat title:", error.message);
    });
    const t = S.chatThreads.find(x=>x.id===data.id); if(t) t.title = clean;
  }).catch(()=>{});
  return data.id;
}
async function send(text){
  if(!text || !text.trim()) return;
  S.chat.push({role:"user", content:text}); S.chat.push({role:"typing"}); renderChat();
  try{
    const threadId = await ensureThread(text);
    const history = S.chat.filter(m=>m.role==="user"||m.role==="assistant").slice(-6)
      .map(m=>({role:m.role, content:m.content}));
    const out = await ai("chat",{ message:text, history: history.slice(0,-1) });
    S.chat.pop(); S.chat.push({role:"assistant", content:out.reply, topics:out.topics});
    if(out.memory) S.studentMemory = out.memory;
    if(out.remembered && out.remembered.length) toast(`Remembered: ${out.remembered[0]}${out.remembered.length>1?` (+${out.remembered.length-1})`:""}`);
    /* Saved so it survives logging out and back in — failures here are silent,
       the conversation still works this session even if a save drops. */
    if(threadId){
      sb.from("chat_messages").insert([
        { student_id:S.me.id, thread_id:threadId, role:"user", content:text },
        { student_id:S.me.id, thread_id:threadId, role:"assistant", content:out.reply },
      ]).then(({error})=>{ if(error) console.warn("Could not save chat message:", error.message); });
      sb.from("chat_threads").update({ updated_at:new Date().toISOString() }).eq("id",threadId).then(()=>{});
    }
  }catch(e){
    S.chat.pop(); S.chat.push({role:"assistant", content:"I couldn't reach the AI service. "+e.message});
  }
  renderChat();
}

/* ---- the facts badges are judged on ---- */
function streakOf(days){
  const set = new Set(days); let best = 0, run = 0;
  const sorted = [...set].sort();
  let prev = null;
  sorted.forEach(d=>{
    const t = new Date(d+"T00:00:00").getTime();
    run = (prev!==null && t - prev === 86400000) ? run+1 : 1;
    best = Math.max(best, run); prev = t;
  });
  return { best, days: set.size };
}

    return Object.values(byTopic).some(sc=>sc.some((v,i)=>sc.slice(i+1).some(w=>w>=v+30)));
  })();

    return Math.max(0, ...Object.values(c)); })();
  const list = [

    { id:"comeback", name:"Comeback",            tier:"epic",      icon:"up",    desc:"Beat an earlier score on a topic by 30 points",
      earned:comeback, progress:comeback?1:0, progressText:comeback?"Done":"Not yet" },
    { id:"realdeal", name:"The Real Deal",       tier:"legendary", icon:"gem",   desc:"Mirage: 80%+ genuine mastery with almost no gap",
      earned:realDeal, progress:realDeal?1:0, progressText:realDeal?"Done":"Not yet" },
    { id:"explorer", name:"Explorer",      tier:"common", icon:"compass",  desc:"Join 3 courses",                         ...n(enrolledCount,3) },
    { id:"early",    name:"Early Bird",    tier:"rare",   icon:"sunrise",  desc:"Complete work before 7 in the morning",  ...flag(hours.some(h=>h>=4 && h<7)) },
    { id:"night",    name:"Night Owl",     tier:"rare",   icon:"moon",     desc:"Complete work after 10 at night",        ...flag(hours.some(h=>h>=22 || h<4)) },
    { id:"scholar",  name:"Scholar",       tier:"rare",   icon:"stack",    desc:"Record 25 pieces of graded work",        ...n(attempts.length,25) },
    { id:"perfect",  name:"Perfectionist", tier:"rare",   icon:"star",     desc:"Score 100% five times",                  ...n(perfect,5) },
    { id:"deep",     name:"Deep Diver",    tier:"rare",   icon:"target",   desc:"Complete 3 Mirage runs",                 ...n(mirageRuns,3) },
    { id:"curator",  name:"Curator",       tier:"rare",   icon:"folder",   desc:"Keep 6 items in your portfolio",         ...n(portfolioCount,6) },
    { id:"streak14", name:"Unstoppable",   tier:"epic",   icon:"bolt",     desc:"Sign in 14 days in a row",               ...n(st.best,14) },
    { id:"polymath", name:"Polymath",      tier:"epic",   icon:"compass",  desc:"Have graded work in 3 different subjects", ...n(subjectsTouched,3) },
    { id:"marathon", name:"Marathon",      tier:"epic",   icon:"mountain", desc:"Complete 10 pieces of work in one day",  ...n(busiestDay,10) },
    { id:"clean",    name:"Clean Sheet",   tier:"epic",   icon:"check",    desc:"Score 100% on an ExamLens analysis",     ...flag(cleanSheet) },
    { id:"centurion",name:"Centurion",     tier:"legendary", icon:"trophy",desc:"Record 100 pieces of graded work",       ...n(attempts.length,100) }
  ];
  /* Strong Genome: one badge per subject scored 80% or more, on at least 3 attempts. */
  const subjects = {};
  attempts.forEach(a=>{ (subjects[a.subject||"Unsorted"] ||= []).push(a); });
  let best = null;
  Object.entries(subjects).forEach(([sub, rows])=>{
    const sc = scoreOf(rows).score;
    const ok = sc>=80 && rows.length>=3;
    if(ok) list.push({ id:"strong:"+sub, name:"Strong Genome", sub, tier:"legendary", icon:"brain",
      desc:`${sub} genome at 80% or above`, earned:true, progress:1, progressText:`${sc}%` });
    else if(!best || sc>best.sc) best = { sub, sc, n:rows.length };
  });
  const strongN = list.filter(b=>b.id.startsWith("strong:")).length;
  list.push({ id:"dual", name:"Dual Mastery", tier:"legendary", icon:"twin",
    desc:"Strong Genome in two different subjects", ...n(strongN,2) });
  if(!list.some(b=>b.id.startsWith("strong:")))
    list.push({ id:"strong:?", name:"Strong Genome", tier:"legendary", icon:"brain",
      desc:"Reach 80% or more on a subject, over at least 3 attempts", earned:false,
      progress: best ? Math.min(1,(best.sc||0)/80) : 0,
      progressText: best ? `Best: ${best.sub} ${best.sc}%` : "No subjects yet" });
  if(ctx.unlockAll){
    /* Granted by an admin in the database: everything counts as earned. */
    const real = list.filter(b=>b.id!=="strong:?");
    real.forEach(b=>{ b.earned = true; b.progress = 1; if(!/\d/.test(b.progressText||"")) b.progressText = "Granted"; });
    real.__all = true;
    return real;
  }
  return list;
}

/* square-crop a photo before upload */
function squareImage(file, size=320){
  return new Promise((resolve,reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? resolve(b) : reject(new Error("Couldn't process that image")), "image/jpeg", 0.88);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Couldn't open that image")); };
    img.src = url;
  });
}

async function taSend(text){
  text = (text||"").trim(); if(!text || S.ta.busy) return;
  S.ta.msgs.push({ role:"user", content:text }); S.ta.busy = true; rerender();
  try{
    const out = await ai("teacher_chat", { message:text });
    S.ta.msgs.push({ role:"assistant", content:out.reply });
    if(out.memory) S.ta.memory = out.memory;
    if(out.remembered && out.remembered.length) toast(`Remembered: ${out.remembered[0]}${out.remembered.length>1?` (+${out.remembered.length-1})`:""}`);
  }catch(e){ S.ta.msgs.push({ role:"assistant", content:"I couldn't reach the AI service. "+e.message }); }
  S.ta.busy = false; rerender();
  const c = $("#taChat"); c && c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
}

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c=>{const r=Math.random()*16|0;return (c=="x"?r:(r&3|8)).toString(16);}));
const blankQ = kind => ({ id:uuid(), kind, prompt:"", options:kind==="mcq"?["",""]:null, answer_index:kind==="mcq"?0:null, expected:"", marks: kind==="mcq"?1:4 });
const confChip = c => `<span class="chip ${c==="low"?"warn":c==="high"?"teal":""}">${c==="low"?"Check this":c==="high"?"Confident":"Fairly sure"}</span>`;

async function loadTests(){
  if(S.me.role==="student"){
    const [t, subs] = await Promise.all([
      sb.from("tests").select("*").eq("status","published").order("created_at",{ascending:false}),
      sb.from("test_submissions").select("*").eq("student_id",S.me.id)
    ]);
    if(t.error && /does not exist|schema cache/i.test(t.error.message)) S.tests.missing = true;
    S.tests.list = t.data||[]; S.tests.subs = subs.data||[];
  } else {
    const t = await sb.from("tests").select("*").eq("teacher_id",S.me.id).order("created_at",{ascending:false});
    if(t.error && /does not exist|schema cache/i.test(t.error.message)) S.tests.missing = true;

    S.tests.subs = ids.length ? ((await sb.from("test_submissions").select("*").in("test_id",ids)).data||[]) : [];

}

    sb.from("question_key").select("*").eq("test_id",id)

  S.tests.builder = { test:t.data, dirty:false,
    questions:(q.data||[]).map(x=>{ const key=(k.data||[]).find(y=>y.question_id===x.id)||{};
      return { id:x.id, kind:x.kind, prompt:x.prompt, options:x.options, marks:x.marks,
               answer_index:key.answer_index, expected:key.expected||"" }; }) };
  rerender();
}

/* Writes the paper the teacher is editing. Called by Save, by Publish, and
   when they navigate away, so questions can never be left only in the browser. */
async function savePaper(){

    const B = S.tests.builder, t = B.test;
    if(B.questions.some(q=>!q.prompt.trim())) throw new Error("Every question needs its text");
    if(B.questions.some(q=>q.kind==="mcq" && (q.options||[]).some(o=>!o.trim()))) throw new Error("Every option needs text");
    const up = await sb.from("tests").update({ title:t.title, subject:t.subject, topic:t.topic, instructions:t.instructions }).eq("id",t.id);
    if(up.error) throw up.error;
    const existing = (await sb.from("test_questions").select("id").eq("test_id",t.id)).data||[];
    const keep = new Set(B.questions.map(q=>q.id));
    const gone = existing.filter(e=>!keep.has(e.id)).map(e=>e.id);
    if(gone.length) await sb.from("test_questions").delete().in("id",gone);
    const rows = B.questions.map((q,i)=>({ id:q.id, test_id:t.id, position:i+1, kind:q.kind, prompt:q.prompt.trim(),
      options: q.kind==="mcq" ? q.options : null, marks:q.marks }));
    if(rows.length){
      const qe = await sb.from("test_questions").upsert(rows).select("id"); if(qe.error) throw qe.error;
      const keys = B.questions.map(q=>({ question_id:q.id, test_id:t.id,
        answer_index: q.kind==="mcq" ? (q.answer_index??0) : null, expected: q.kind==="mcq" ? null : (q.expected||"") }));
      const ke = await sb.from("question_key").upsert(keys); if(ke.error) throw ke.error;
    }
      S.tests.builder.dirty = false;
  toast("Paper saved");
}
async function saveMarks(subId){
  const M = S.tests.marking;
  const rows = M.questions.map((q,i)=>{
    const prev = (M.open.marks.find(m=>m.question_id===q.id)||{});
    const score = Math.max(0, Math.min(q.marks, Number(($("#mScore"+i)||{}).value ?? prev.score ?? 0)));
    const feedback = ($("#mFb"+i)||{}).value ?? prev.feedback ?? "";
    const changed = prev.ai_score!==undefined && prev.ai_score!==null && Number(prev.ai_score)!==score;
    return { submission_id:subId, question_id:q.id, score, max_marks:q.marks, feedback,
             correct:prev.correct??null, ai_score:prev.ai_score??null, confidence:prev.confidence??null,
             marked_by: changed ? "teacher" : (prev.marked_by||"ai") };
  });
  const { error } = await sb.from("test_marks").upsert(rows, { onConflict:"submission_id,question_id" });
  if(error) throw error;
  M.open.marks = rows;
  const total = rows.reduce((t,r)=>t+r.score,0), outOf = M.questions.reduce((t,q)=>t+q.marks,0);
  await sb.from("test_submissions").update({ total_score: total, total_marks: outOf }).eq("id", subId);
  return { total, outOf };
}

const APP_VERSION = "1.0";
const PREFS_KEY = "edunexus-prefs";
const PREF_DEFAULTS = { theme:"dark", accent:"teal", size:"normal", motion:"full",
  contrast:"normal", font:"default", density:"comfortable",
  celebrate:"on", tips:"on", confirm:"on" };
function getPrefs(){
  try{ return { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem(PREFS_KEY) || "{}") }; }
  catch(e){ return { ...PREF_DEFAULTS }; }
}
function applyPrefs(p){
  const r = document.documentElement;
  let t = p.theme;
  if(t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  r.dataset.theme = t; r.dataset.accent = p.accent; r.dataset.size = p.size; r.dataset.motion = p.motion;
  r.dataset.contrast = p.contrast; r.dataset.font = p.font; r.dataset.density = p.density;
}
/* Preferences follow the account, so a student's theme is the same on the
   school computer as on their phone. Saved locally first so nothing flickers. */
let prefSyncTimer = null;
function syncPrefs(p){
  if(!sb || !S.me) return;
  clearTimeout(prefSyncTimer);
  prefSyncTimer = setTimeout(()=>{
    sb.from("profiles").update({ settings: { ...(S.me.settings||{}), prefs:p } }).eq("id",S.me.id)
      .then(({error})=>{ if(!error) S.me.settings = { ...(S.me.settings||{}), prefs:p }; });
  }, 700);
}
function setPref(key, value){
  const p = { ...getPrefs(), [key]: value };
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){}
  applyPrefs(p); syncPrefs(p); rerender();
}

const prefOn = k => getPrefs()[k] !== "off";

async function loadCalendar(){
  const from = new Date(); from.setMonth(from.getMonth()-1);
  const to = new Date(); to.setMonth(to.getMonth()+3);
  const [slots, ev, tests] = await Promise.all([
    sb.from("timetable_slots").select("*").eq("user_id",S.me.id).order("day").order("starts"),
    sb.from("events").select("*").gte("starts_at",from.toISOString()).lte("starts_at",to.toISOString()).order("starts_at"),
    sb.from("tests").select("id, title, subject, due_at, status, teacher_id").not("due_at","is",null)
  ]);
  if(slots.error && /does not exist|schema cache/i.test(slots.error.message)) S.cal.missing = true;
  S.cal.slots = slots.data||[]; S.cal.events = ev.data||[]; S.cal.tests = tests.data||[];
  rerender();
}
/* everything that lands on a given day: events, test deadlines, study sessions */
function itemsOn(day){
  const out = S.cal.events.filter(e=>sameDay(new Date(e.starts_at), day)).map(e=>({ ...e, source:"event" }));
  S.cal.tests.filter(t=>t.due_at && sameDay(new Date(t.due_at), day))
    .forEach(t=>out.push({ id:"t-"+t.id, kind:"deadline", title:t.title+" due", starts_at:t.due_at,
      all_day:false, source:"test", notes:t.subject }));
  return out.sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
}
function slotsOn(day){ return (S.cal.slots||[]).filter(s=>s.day === ((day.getDay()+6)%7)+1); }

/* ================= router ================= */
function route(){
  const parts = location.hash.replace(/^#\//,"").split("/");
  let view = parts[0] || (S.me.role==="student" ? "home" : "class");
  S.course = null; S.lesson = null;
  if(view==="course" || view==="edit") S.course = parts[1];
  if(["build","marking","sit","result"].includes(view)){
    const id = parts[1];
    if(S.tests.openId !== id){ S.tests.openId = id; S.tests.builder = S.tests.marking = S.tests.take = S.tests.result = null; }
  }
  S.gSubject = view==="genome" && parts[1] ? decodeURIComponent(parts[1]) : null;
  S.gTopic   = view==="genome" && parts[2] ? decodeURIComponent(parts[2]) : null;
  if(view==="lesson") S.lesson = parts[1];
  if(!V[view]) view = S.me.role==="student" ? "home" : "class";
  if(S.me.role==="student" && ["class","courses","edit","student","assistant","build","marking"].includes(view)) view = "home";
  if(S.me.role!=="student" && ["home","learn","genome","examlens","mirage","doctor","portfolio","course","lesson","sit","result"].includes(view))
    view = "class";
  $("#main").innerHTML = `<div class="mobiletop">
      <img class="wordmark" src="branding/EduNexus-wordmark-transparent.png" alt="EduNexus" style="height:24px">
      <a href="#/profile" aria-label="Your profile">${avatarHtml(S.me, 34)}</a></div>
    <div class="fade">${V[view]()}</div>`;
  $("#aside").innerHTML = aside(view);
  buildNav();
  if(view==="assistant"){
    const i = $("#taAsk"); i && i.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const v=i.value; i.value=""; taSend(v); }});
    const c = $("#taChat"); c && c.lastElementChild && c.lastElementChild.scrollIntoView({block:"end"});
  }
  if(view==="counsellor"){
    renderChat();
    const i = $("#ask");
    i && i.addEventListener("keydown", e=>{ if(e.key==="Enter"){ send(i.value); i.value=""; }});
  }
  window.scrollTo(0,0);
}
const rerender = () => route();

/* Re-rendering wipes the form, so read it into the draft first.
   This is what was clearing the lesson pane when the AI ran. */
function captureDraft(){
  if(!$("#lTitle")) return;
  const d = S.cache.draft || {};
  d.title = $("#lTitle").value.trim();
  d.topic = $("#lTopic").value.trim();
  d.duration_min = Number($("#lMin").value) || 20;
  if($("#lBody"))    d.body = $("#lBody").value;
  if($("#lVideo"))   d.video_url = $("#lVideo").value.trim();
  if($("#lTrans"))   d.transcript = $("#lTrans").value;
  if($("#lSummary")) d.summary = $("#lSummary").value;
  if($("#cpQ")){
    const options = $$("[id^=cpO]").map(i=>i.value.trim()).filter(Boolean);
    d.checkpoint = { question:$("#cpQ").value.trim(), options,
      answer: Math.max(0, Math.min(options.length-1, Number($("#cpAns").value)-1)),
      explanation: (d.checkpoint && d.checkpoint.explanation) || "" };
  }
  S.cache.draft = d;
}
async function withBusy(key, fn){
  S.busy[key]=true; rerender();
  try{ await fn(); }catch(e){ toast(e.message||"Something went wrong"); }
  S.busy[key]=false; rerender();
}

const ACT = {
  async join(el){
    const { error } = await sb.from("enrollments").insert({student_id:S.me.id, course_id:el.dataset.id});
    if(error) return toast(error.message);
    S.enrolled.push(el.dataset.id); toast("Joined"); rerender(); checkUnlocks();
  },
  async "answer-cp"(el){
    const l = S.lessons.find(x=>x.id===S.lesson), cp = l.checkpoint;
    const chosen = Number(el.dataset.i), right = chosen === Number(cp.answer);
    $$("[data-act=answer-cp]").forEach(b=>{ b.style.opacity=.5; b.disabled=true; });
    el.style.opacity=1; el.style.borderColor = right ? "var(--teal)" : "var(--warn-line)";
    $("#cpOut").innerHTML = `<div class="card" style="margin-top:12px;border-color:${right?"rgba(var(--accent-rgb),.4)":"var(--warn-line)"};background:${right?"var(--teal-ghost)":"var(--warn-soft)"}">
      <b class="${right?"teal-text":"warn-text"}" style="font-size:var(--fs-2)">${right?"Correct":"Not correct"}</b>
      <p class="note" style="margin:8px 0 0"><span class="spin"></span>Edu AI is looking at your reasoning…</p></div>`;
    const course = S.courses.find(c=>c.id===l.course_id);
    await record({ kind:"lesson", subject:course?course.subject:null, topic:l.topic,
                   score: right?100:0, lesson_id:l.id,
                   meta:{ chosen, question:cp.question,
                          chosenText:(cp.options||[])[chosen],
                          correctText:(cp.options||[])[cp.answer] } });
    let text = cp.explanation || "";
    try{
      const out = await ai("checkpoint",{ topic:l.topic, question:cp.question, options:cp.options,
        chosen:(cp.options||[])[chosen], correct:(cp.options||[])[cp.answer], wasRight:right });
      text = out.text || text;
    }catch(e){ text = text || "Saved. The AI explanation is unavailable right now."; }
    $("#cpOut").innerHTML = `<div class="card" style="margin-top:12px;border-color:${right?"rgba(var(--accent-rgb),.4)":"var(--warn-line)"};background:${right?"var(--teal-ghost)":"var(--warn-soft)"}">
      <b class="${right?"teal-text":"warn-text"}" style="font-size:var(--fs-2)">${right?"Correct":"Not correct"}</b>
      <p class="prose" style="margin:8px 0 0;font-size:var(--fs-2)">${esc(text)}</p>
      <div class="note" style="margin-top:10px">Recorded to your genome under ${esc(l.topic)}.</div></div>`;
  },
  "run-examlens"(){
    /* Read the form BEFORE withBusy's rerender wipes these fields — same trap
       captureDraft() exists for on the lesson editor. */
    const d = S.cache.examlensDraft = {
      subject:($("#exSub")||{}).value?.trim()||"", topic:($("#exTopic")||{}).value?.trim()||"",
      question:($("#exQ")||{}).value?.trim()||"", answer:($("#exA")||{}).value?.trim()||"",
      expected:($("#exE")||{}).value?.trim()||""
    };
    if(!d.question||!d.answer) return toast("Add the question and your answer first");
    withBusy("examlens", async ()=>{
      const out = await ai("examlens",{ question:d.question, answer:d.answer, expected:d.expected, subject:d.subject, topic:d.topic });
      S.cache.examlens = out;
      await record({ kind:"examlens", subject:d.subject, topic: out.topic||d.topic||"Unspecified topic",
        score: Number(out.score)||0,
        meta:{ cause:out.cause, verdict:out.verdict, question:d.question, answer:d.answer,
               explanation:out.explanation, correct_working:out.correct_working } });
    });
  },
  "examlens-ocr"(){
    const files = [...((($("#exPhoto")||{}).files)||[])];
    if(!files.length) return toast("Choose or take a photo first");
    const cur = S.cache.examlensDraft = {
      subject:($("#exSub")||{}).value?.trim()||"", topic:($("#exTopic")||{}).value?.trim()||"",
      question:($("#exQ")||{}).value?.trim()||"", answer:($("#exA")||{}).value?.trim()||"",
      expected:($("#exE")||{}).value?.trim()||""
    };
    withBusy("examlensOcr", async ()=>{
      const images = await Promise.all(files.slice(0,3).map(f=>fileToCompressedDataURL(f)));
      const out = await ai("examlens_ocr",{images});
      S.cache.examlensDraft = {
        subject: cur.subject || out.subject_guess || "",
        topic: cur.topic || out.topic_guess || "",
        question: out.question || cur.question || "",
        answer: out.answer || cur.answer || "",
        expected: out.expected || cur.expected || ""
      };
      toast("Read from photo — check it's right, then Analyse");
    });
  },
  "mirage-generate"(){
    const d = S.cache.mirageDraft = {
      topic: ($("#miTopic")||{}).value?.trim()||"", subject: ($("#miSub")||{}).value?.trim()||""
    };
    if(!d.topic) return toast("Choose a topic first");
    withBusy("mirage", async ()=>{
      const out = await ai("mirage_generate",{ topic:d.topic, subject:d.subject });
      S.cache.mirage = { topic:d.topic, subject:d.subject, questions: out.questions || [], answers:[], results:null };
    });
  },
  "mirage-mark"(){
    const m = S.cache.mirage;
    m.answers = m.questions.map((_,i)=> ($("#mi"+i)||{}).value || "");
    withBusy("mirageMark", async ()=>{
      const out = await ai("mirage_mark",{ topic:m.topic,
        answers: m.questions.map((q,i)=>({ ...q, answer:m.answers[i] })) });
      m.results = out.results || []; m.verdict = out.verdict; m.root_cause = out.root_cause;
      const lv = n => m.results.find(r=>r.level===n) || {score:0};
      const genuine = Math.round((lv(4).score + lv(5).score)/2);
      const apparent = Math.round((lv(1).score+lv(2).score)/2);
      const breakdown = m.questions.map((q,i)=>({
        level:q.level, label:q.label, question:q.question, expected:q.expected,
        answer:m.answers[i], score:(m.results[i]||{}).score, note:(m.results[i]||{}).note
      }));
      await record({ kind:"mirage", subject:m.subject, topic:m.topic, score:genuine,
        meta:{ apparent, genuine, verdict:m.verdict, root_cause:m.root_cause, breakdown } });
    });
  },
  "run-doctor"(){ withBusy("doctor", async ()=>{
    const since = Date.now()-1000*60*60*24*14;
    const session = S.attempts.filter(a=>new Date(a.created_at).getTime()>since)
      .map(a=>({kind:a.kind, topic:a.topic, score:a.score, seconds:a.seconds}));
    /* Real taught order per enrolled course, from each lesson's own position —
       this is what lets the doctor reason about prerequisites from actual

  async "test-status"(el){

    if(error) return toast(error.message);
    const t = (S.tests.list||[]).find(x=>x.id===el.dataset.id); if(t) t.status = el.dataset.s;
    if(S.tests.builder && S.tests.builder.test.id===el.dataset.id) S.tests.builder.test.status = el.dataset.s;

  "q-kind"(el){ captureBuilder(); S.tests.builder.dirty = true; const q = S.tests.builder.questions[Number(el.dataset.i)], k = el.dataset.k;
